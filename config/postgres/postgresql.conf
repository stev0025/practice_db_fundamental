# PostgreSQL 16 Configuration for DB Fundamentals Lab
# Designed for observability, hands-on diagnostics, and educational transparency.

# Connectivity
listen_addresses = '*'
port = 5432
max_connections = 100

# Memory Settings
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 512MB

# Observability Extensions & Profiling
shared_preload_libraries = 'pg_stat_statements,pg_buffercache'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
track_io_timing = on
track_functions = all

# WAL & Checkpoints
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 5min

# Logging & Lock Diagnostics
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 250
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
deadlock_timeout = 1s

# Autovacuum Diagnostics (aggressive naptime for lab observability)
autovacuum = on
autovacuum_naptime = 10s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
